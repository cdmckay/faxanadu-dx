# What each feature takes from the game, so features cannot quietly collide.
# tools/check_allocations.py fails when:
#   - a game.toml hook site belongs to no feature (by id prefix),
#   - two features claim overlapping ROM and no [[shared_rom]] says why that is
#     safe,
#   - a claimed ROM range is not unused ($FF) in the stock image (with --rom),
#   - an overridden ROM byte is not its declared stock value (with --rom),
#   - two features that can be enabled together hook the same address and no
#     [[shared_site]] below says why that is safe.
# Features that share a manifest exclusive group are never enabled together.
# ROM claims come in two kinds: `rom` takes unused ($FF) bytes for new data,
# and `overrides` takes existing bytes the feature serves with other values,
# one byte per entry of `stock` (what the stock image holds there).
# Update this file with the feature, and docs/GAME_INTERNALS.md with it.

[[feature]]
package = "faxanadu.enhancement.guru-travel"
source = "fax_travel.c"
hooks = "faxanadu.travel."
# Supplied through read overrides; the ROM image itself is never changed.
rom = [
    { bank = 12, start = 0xAE00, end = 0xAE07, use = "SAY and ASK interaction-script steps" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the Guru's current line" },
]
# Writes only the game's own variables: TempleSpawnPoint, IScriptOrCHRAddr
# and IScriptOffset, and the stack at $01FA-$01FF when a journey starts.

[[feature]]
package = "faxanadu.enhancement.seamless-world"
source = "fax_world.c"
hooks = "faxanadu.world."
rom = []

[[shared_site]]
addr = 0xE016   # GameLoop_CheckShowPlayerMenu
hooks = ["faxanadu.world.inventory", "faxanadu.travel.main-loop"]
why = """Seamless (freeze_hook) observes and returns 0, so later sites still \
fire. Guru travel handles the call only to start a journey, and its site is \
the last at this address."""

[[feature]]
package = "faxanadu.enhancement.death-keeps-gold"
source = "fax_death.c"
hooks = "faxanadu.death-keeps-gold."
rom = []
# Hooks only Player_SetInitialExpAndGold ($95B1, bank 12), which no other
# feature hooks, and writes nothing: it tells a death from a mantra by the far
# call's return address, so it needs no hook at Player_HandleDeath ($D8EC).

[[feature]]
package = "faxanadu.enhancement.pendant-fix"
source = "fax_pendant.c"
hooks = "faxanadu.pendant-fix."
rom = []
# Hooks only @_checkGlove ($8884, bank 14), which no other feature hooks, and
# writes only Temp_00 there, which the routine sets for this hit just before.

[[feature]]
package = "faxanadu.enhancement.magic-button"
source = "fax_magic.c"
hooks = "faxanadu.magic-button."
rom = []
# Hooks Player_CastMagic ($BA5B, bank 14) and GameLoop_CheckUseCurrentItem
# ($C478), which no other feature hooks, and never handles either. Writes only
# the joypad masks ($16, $18, $19) between the two calls, and puts back what
# it found. A feature that later hooks $C478 and handles it must sit after
# this one in game.toml, or the real masks are never restored.

[[feature]]
package = "faxanadu.enhancement.zone-names"
source = "fax_banner.c"
hooks = "faxanadu.zone-names."
rom = []
# No hooks and no ROM: it reads RAM at the end of each frame and draws over
# the presented picture (fax_text.c), after Seamless has composed it.

[[feature]]
package = "faxanadu.enhancement.speaker-names"
source = "fax_speaker.c"
hooks = "faxanadu.speaker-names."
rom = []
# No hooks and no ROM: it reads RAM and the nametable when the picture is
# presented and draws over it (fax_text.c), after Seamless and zone names.

[[feature]]
package = "faxanadu.enhancement.auto-keys"
source = "fax_keys.c"
hooks = "faxanadu.auto-keys."
rom = []
# Writes SelectedItem, ItemInventory and NumberOfItems, as selecting and using
# a key would. Shares fax_keys.c with reusable tools.

[[feature]]
package = "faxanadu.enhancement.reusable-tools"
source = "fax_keys.c"
hooks = "faxanadu.reusable-tools."
rom = []
# Writes SelectedItem only, putting back the key the game just cleared.

[[shared_site]]
addr = 0xC8DC   # UI_ClearSelectedItemPic
hooks = ["faxanadu.auto-keys.unlocked", "faxanadu.reusable-tools.unlocked"]
why = """Both sites run the same callback, fax_keys.c's unlocked_hook, which \
finishes the door for whichever of the two features are on. When the first \
site handles the call the second is skipped; when it does not, the second \
finds nothing to do either. It acts only when Game_UnlockDoorWithUsableItem \
is the caller."""

[[feature]]
package = "faxanadu.enhancement.falling-pose"
source = "fax_falling.c"
hooks = "faxanadu.falling-pose."
rom = []
# Hooks Player_GetBodySpriteFrameOffset ($ECAC) and Maybe_Player_CalcAnimFrame
# ($B927, bank 14) at their entry, and observes @_setFalling ($E3D1) and
# @_checkCapFall's branch ($E423) in Player_HandleVertLadderOrJump. No other
# feature hooks these. Writes nothing in RAM: it answers the pose routines in A.

[[feature]]
package = "faxanadu.enhancement.forgiving-jumps"
source = "fax_jumps.c"
hooks = "faxanadu.forgiving-jumps."
rom = []
# Hooks Player_CheckHandleVertMovement ($E2C8) at its entry and two branches
# inside the hero's vertical update: the ground check ($E3B2) and the jump
# check ($E44B). No other feature hooks these. Writes only Player_PosY (the
# fall step of a coyote jump) and the registers at those branches. Reads
# Block's fax_block_raised(): while Block is up it keeps no press.

[[feature]]
package = "faxanadu.enhancement.text-speed"
source = "fax_text_speed.c"
hooks = "faxanadu.text-speed."
rom = []
# Writes only TextBox_Timer ($021D) and TextBox_PlayTextSound ($0212), at
# TextBox_ShowNextChar_IfReady ($F491), which no other feature hooks.
# Reads the joypad masks' A bit, which the Magic button never changes: it ORs
# in Up and B only between Player_CastMagic and GameLoop_CheckUseCurrentItem,
# where no message types.

[[feature]]
package = "faxanadu.enhancement.taller-dagger"
source = "fax_dagger.c"
hooks = "faxanadu.taller-dagger."
rom = []
# Served through a read override; the ROM image itself is never changed.
overrides = [
    { bank = 14, start = 0xB898, stock = [0x04], use = "MAYBE_WEAPON_RANGES: the dagger's Y reach, served as $08" },
]

[[feature]]
package = "faxanadu.enhancement.save-files"
source = "fax_files.c"
hooks = "faxanadu.files."
# Supplied through read overrides; the ROM image itself is never changed.
rom = [
    { bank = 12, start = 0xAE10, end = 0xAE18, use = "the Guru's choice (menu or question) and its own SAY step" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the Guru's line slot, shared with Guru travel" },
]
overrides = [
    { bank = 12, start = 0x8631, stock = [0x10], use = "IScriptAction_ShowBuySellMenu's LDA #$10: the menu's message, served as $C3 for the Guru's menu only" },
]
# Hooks StartScreen_CheckHandleInput ($9F44), PasswordScreen_Show ($909D),
# the start screen's JMP Player_Spawn ($FC95), Player_Spawn after
# Game_SpawnInTemple ($DB20) and TextBox_ClearPasswordSize after it zeroes the
# line scroll ($F439), which no other feature hooks, and
# IScripts_InvokeNextAction ($826E) with Guru travel.
# The operand is $C3 only from the Guru's menu step to the end of that frame
# (the menu reads it at once), then the stock $10 again, so the shops' menu
# never sees it. Writes TempleSpawnPoint (the saved Guru), the joypad's
# changed mask on the title screen, DAT_0687 (Start or Continue),
# IScriptOrCHRAddr and IScriptOffset, and the progress Password_Load would
# write when continuing.

[[shared_rom]]
bank = 13
start = 0xB45B
end = 0xB48B
packages = ["faxanadu.enhancement.guru-travel", "faxanadu.enhancement.save-files"]
why = """Message $C3, one line slot for the Guru's lines. Each feature writes \
its line there just before the step that shows it, and the two never show a \
line at once: Save files' choice comes first and starts Guru travel's part \
through fax_travel_begin. After a save state loads, Save files puts its line \
back in state_loaded, after Guru travel's record has restored its own."""

[[shared_site]]
addr = 0x826E   # IScripts_InvokeNextAction
hooks = ["faxanadu.files.next-action", "faxanadu.travel.next-action"]
why = """Neither handles the call; each only steers the interpreter by writing \
IScriptOrCHRAddr. Neither redirects to an address the other acts on: with a \
file in play Guru travel leaves the script's ends to Save files \
(fax_files_guru_choice), Save files acts on the Gurus' own actions and its \
own steps, and it undoes SET_SPAWN_POINT's raise at the next action rather \
than skipping it, so Guru travel still meets the Guru there. So the two may \
run in either order."""

[[feature]]
package = "faxanadu.enhancement.shields"
source = "fax_block.c"
hooks = "faxanadu.block."
rom = []
# Hooks GameLoop_CountdownItems ($C88F), Player_HandleHitByMagic ($87DC),
# Player_HandleTouchEnemyMagic ($8999) and IScriptAction_EndScript ($82B4),
# which no other feature hooks, and Sugata's flash's damage ($AB44), which
# fax_sugata.c, in the same mod, hooks too (below).
# Writes the stack (a return address, as a JSR would) and, when the tutorial
# speaks, IScriptOrCHRAddr and IScriptOffset. It plays sound $0C with
# Sound_PlayEffect. Its host input callback clears the d-pad, A and B while
# Block is up in play; no other feature has an input callback. The tutorial
# borrows Guru travel's SAY step and message $C3 slot (claimed above,
# fax_travel.h) through the same read overrides rather than claiming ROM of its
# own: 55 of the 64 overrides are Guru travel's, and its line would need 48
# more. It sets those overrides itself, so it speaks with Guru travel off too. It speaks only as the script that gave the hero his first shield-slot
# item ends (a shop's, or the Battle Helmet's pickup, ISCRIPT_GOT_BATTLE_HELMET
# at $A698), never in a Guru's, and Guru travel writes its own line into the
# slot again before each one it says.
# What Block looks like: Player_DrawShield after it sets the shield's box
# ($B9C3), Player_DrawBody ($EBEE) and Player_DrawWeapon ($B7D6), at their
# entries, which no other feature hooks (Seamless hooks Player_DrawShield's
# entry, $B982, and the falling pose Maybe_Player_CalcAnimFrame, $B927, a
# different instruction each). While Block is up it writes
# Arg_DrawSprite_PosX/Y ($27, $28) there, so the shield is drawn raised, never
# Player_ShieldPositionX/Y, the shield's box; and as it goes up with nothing
# raised, the palette bits of the body's sprites in the shadow OAM ($0700),
# the slots Player_DrawBody just drew.

[[feature]]
package = "faxanadu.enhancement.shields"
source = "fax_sugata.c"
hooks = "faxanadu.sugata."
rom = []
# Sugata's flash, in one mod with Block (fax_block.c), whose button it needs
# for the Magic Shield's reflection. Hooks SpriteBehavior_FlashScreenHitPlayer
# ($AB26, $AB36, and $AB44, the damage, with Block's site there) and
# SpriteUpdateHandler_Enemy_Sugata ($929F), which only Sugata runs. Its site
# at $AB44 is first in game.toml: it handles the call when the flash is out of
# reach, the Magic Shield reflects it, or Ointment keeps the HP (only with
# Block down), and Block's is then skipped; otherwise it returns 0 and Block's
# stops the flash if Block is up. Both finish the behavior through $AB60. Writes PPU_Mask's greyscale bit (clearing what the behavior
# just set), Temp_00 and the stack, and Sugata's HP and knockback through
# Player_HitEnemyWithMagic's own code when the Magic Shield reflects. Under
# Ointment it writes what the flash itself writes, Player_InvincibilityPhase
# and Player_StatusFlag's knockback bit, and plays sound 4. It draws the band
# over the presented picture, after Seamless composes it and before the zone
# banner.

