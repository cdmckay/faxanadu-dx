[[shared_site]]
addr = 0xC8DC   # UI_ClearSelectedItemPic
hooks = ["faxanadu.auto-keys.unlocked", "faxanadu.reusable-tools.unlocked"]
why = """Both sites run the same callback, fax_keys.c's unlocked_hook, which \
finishes the door for both features. When the first site handles the call the \
second is skipped; when it does not, the second finds nothing to do either, \
so the order does not matter. It acts only when \
Game_UnlockDoorWithUsableItem is the caller."""

