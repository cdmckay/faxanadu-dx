# What each feature takes from the game, so features cannot quietly collide.
#
# Every feature of the remaster is a trusted plugin of the one Faxanadu
# Remastered switch (package faxanadu.remastered, feature `remastered`), so
# they are always on together, and may rely on each other. Seamless, the view
# inherited from upstream, is its own package and can be on with them.
# tools/check_allocations.py treats every two features below as enabled
# together, unless their manifest features share an exclusive group, and fails
# when:
#   - a game.toml hook site belongs to no feature, or to two (by id prefix),
#   - a manifest's [[plugin]] belongs to no feature here, or a feature's
#     `plugin` is not in its package's manifest,
#   - two features hook the same address and no [[shared_site]] lists exactly
#     the hooks there, in the order they run, with why that is safe. On the
#     cycle host that order is game.toml's: cyc_hooks_fire walks the sites in
#     the order game.toml declares them, not HOST_EXTRAS link order,
#   - two features claim overlapping ROM and no [[shared_rom]] names both and
#     says why that is safe,
#   - a [[shared_site]] or [[shared_rom]] no longer matches what it covers,
#   - the bytes claimed, all served through read overrides, need more entries
#     than the override table has (CYC_MOD_READ_OVERRIDES_MAX, 64),
#   - a claimed ROM range is not unused ($FF) in the stock image (with --rom),
#   - an overridden ROM byte is not its declared stock value (with --rom).
# ROM claims come in two kinds: `rom` takes unused ($FF) bytes for new data,
# and `overrides` takes existing bytes the feature serves with other values,
# one byte per entry of `stock` (what the stock image holds there). Claim
# every byte a feature serves, even one it borrows from another feature.
# Update this file with the feature, and docs/GAME_INTERNALS.md with it.

[[feature]]
id = "guru-travel"
package = "faxanadu.remastered"
plugin = "faxanadu.guru-travel"
source = "fax_travel.c"
hooks = "faxanadu.travel."
# Supplied through read overrides; the ROM image itself is never changed.
rom = [
    { bank = 12, start = 0xAE00, end = 0xAE07, use = "SAY and ASK interaction-script steps" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the Guru's current line" },
]
# Writes only the game's own variables: TempleSpawnPoint, IScriptOrCHRAddr
# and IScriptOffset, and the stack at $01FA-$01FF when a journey starts.

[[feature]]
id = "seamless-world"
package = "faxanadu.enhancement.seamless-world"
plugin = "faxanadu.seamless-world"
source = "fax_world.c"
hooks = "faxanadu.world."
rom = []

[[shared_site]]
addr = 0xE016   # GameLoop_CheckShowPlayerMenu
hooks = ["faxanadu.world.inventory", "faxanadu.travel.main-loop"]
why = """Seamless (freeze_hook) observes and returns 0, so later sites still \
fire. Guru travel handles the call only to start a journey, and its site is \
the last at this address."""

[[feature]]
id = "death-keeps-gold"
package = "faxanadu.remastered"
plugin = "faxanadu.death-keeps-gold"
source = "fax_death.c"
hooks = "faxanadu.death-keeps-gold."
rom = []
# Hooks only Player_SetInitialExpAndGold ($95B1, bank 12), which no other
# feature hooks, and writes nothing: it tells a death from a mantra by the far
# call's return address, so it needs no hook at Player_HandleDeath ($D8EC).
# Save files continues a file through the mantra's path, so this passes that
# call as a mantra's, and Save files then puts back the file's own gold and
# experience at $FC95.

[[feature]]
id = "pendant-fix"
package = "faxanadu.remastered"
plugin = "faxanadu.pendant-fix"
source = "fax_pendant.c"
hooks = "faxanadu.pendant-fix."
rom = []
# Hooks only @_checkGlove ($8884, bank 14), which no other feature hooks, and
# writes only Temp_00 there, which the routine sets for this hit just before.

[[feature]]
id = "magic-button"
package = "faxanadu.remastered"
plugin = "faxanadu.magic-button"
source = "fax_magic.c"
hooks = "faxanadu.magic-button."
rom = []
# Hooks Player_CastMagic ($BA5B, bank 14) and GameLoop_CheckUseCurrentItem
# ($C478), which no other feature hooks, and never handles either. Writes only
# the joypad masks ($16, $18, $19) between the two calls, and puts back what
# it found. A feature that later hooks $C478 and handles it must sit after
# this one in game.toml, or the real masks are never restored.

[[feature]]
id = "zone-names"
package = "faxanadu.remastered"
plugin = "faxanadu.zone-names"
source = "fax_banner.c"
hooks = "faxanadu.zone-names."
rom = []
# No hooks and no ROM: it reads RAM at the end of each frame and draws over
# the presented picture (fax_text.c), after Seamless has composed it.

[[feature]]
id = "speaker-names"
package = "faxanadu.remastered"
plugin = "faxanadu.speaker-names"
source = "fax_speaker.c"
hooks = "faxanadu.speaker-names."
rom = []
# No hooks and no ROM: it reads RAM and the nametable when the picture is
# presented and draws over it (fax_text.c), after Seamless and zone names.

[[feature]]
id = "auto-keys"
package = "faxanadu.remastered"
plugin = "faxanadu.auto-keys"
source = "fax_keys.c"
hooks = "faxanadu.auto-keys."
rom = []
# Writes SelectedItem, ItemInventory and NumberOfItems, as selecting and using
# a key would. Shares fax_keys.c with reusable tools.

[[feature]]
id = "reusable-tools"
package = "faxanadu.remastered"
plugin = "faxanadu.reusable-tools"
source = "fax_keys.c"
hooks = "faxanadu.reusable-tools."
rom = []
# Writes SelectedItem only, putting back the key the game just cleared.

[[shared_site]]
addr = 0xC8DC   # UI_ClearSelectedItemPic
hooks = ["faxanadu.auto-keys.unlocked", "faxanadu.reusable-tools.unlocked"]
why = """Both sites run the same callback, fax_keys.c's unlocked_hook, which \
finishes the door for both features. When the first site handles the call the \
second is skipped; when it does not, the second finds nothing to do either, \
so the order does not matter. It acts only when \
Game_UnlockDoorWithUsableItem is the caller."""

[[feature]]
id = "falling-pose"
package = "faxanadu.remastered"
plugin = "faxanadu.falling-pose"
source = "fax_falling.c"
hooks = "faxanadu.falling-pose."
rom = []
# Hooks Player_GetBodySpriteFrameOffset ($ECAC) and Maybe_Player_CalcAnimFrame
# ($B927, bank 14) at their entry, and observes @_setFalling ($E3D1) and
# @_checkCapFall's branch ($E423) in Player_HandleVertLadderOrJump. No other
# feature hooks these. Writes nothing in RAM: it answers the pose routines in A.

[[feature]]
id = "forgiving-jumps"
package = "faxanadu.remastered"
plugin = "faxanadu.forgiving-jumps"
source = "fax_jumps.c"
hooks = "faxanadu.forgiving-jumps."
rom = []
# Hooks Player_CheckHandleVertMovement ($E2C8) at its entry and two branches
# inside the hero's vertical update: the ground check ($E3B2) and the jump
# check ($E44B). No other feature hooks these. Writes only Player_PosY (the
# fall step of a coyote jump) and the registers at those branches.

[[feature]]
id = "text-speed"
package = "faxanadu.remastered"
plugin = "faxanadu.text-speed"
source = "fax_text_speed.c"
hooks = "faxanadu.text-speed."
rom = []
# Writes only TextBox_Timer ($021D) and TextBox_PlayTextSound ($0212), at
# TextBox_ShowNextChar_IfReady ($F491), which no other feature hooks.
# Reads the joypad masks' A bit, which the Magic button never changes: it ORs
# in Up and B only between Player_CastMagic and GameLoop_CheckUseCurrentItem,
# where no message types.

[[feature]]
id = "taller-dagger"
package = "faxanadu.remastered"
plugin = "faxanadu.taller-dagger"
source = "fax_dagger.c"
hooks = "faxanadu.taller-dagger."
rom = []
# Served through a read override; the ROM image itself is never changed.
overrides = [
    { bank = 14, start = 0xB898, stock = [0x04], use = "MAYBE_WEAPON_RANGES: the dagger's Y reach, served as $08" },
]

[[feature]]
id = "save-files"
package = "faxanadu.remastered"
plugin = "faxanadu.save-files"
source = "fax_files.c"
hooks = "faxanadu.files."
# Supplied through read overrides; the ROM image itself is never changed.
# $AE14, where B on the question goes on to, is never read: the next-action
# hook steers the interpreter on before it is, so it is not served.
rom = [
    { bank = 12, start = 0xAE10, end = 0xAE14, use = "the Guru's choice: the menu (0F SAY) or the question (16 C3 SAY)" },
    { bank = 12, start = 0xAE15, end = 0xAE18, use = "its own SAY step (03 C3 00), for when Guru travel's is not served" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the Guru's line slot, shared with Guru travel" },
]
overrides = [
    { bank = 12, start = 0x8631, stock = [0x10], use = "IScriptAction_ShowBuySellMenu's LDA #$10: the menu's message, served as $C3 for the Guru's menu only" },
]
# Hooks StartScreen_CheckHandleInput ($9F44), PasswordScreen_Show ($909D),
# the start screen's JMP Player_Spawn ($FC95), Player_Spawn after
# Game_SpawnInTemple ($DB20) and TextBox_ClearPasswordSize after it zeroes the
# line scroll ($F439), which no other feature hooks, and
# IScripts_InvokeNextAction ($826E) with Guru travel.
# The operand is $C3 only from the Guru's menu step to the end of that frame
# (the menu reads it at once), then the stock $10 again, so the shops' menu
# never sees it. Writes TempleSpawnPoint (the saved Guru), the joypad's
# changed mask on the title screen, DAT_0687 (Start or Continue),
# IScriptOrCHRAddr and IScriptOffset, and the progress Password_Load would
# write when continuing.

[[shared_rom]]
bank = 13
start = 0xB45B
end = 0xB48B
features = ["guru-travel", "save-files", "block"]
why = """Message $C3, one line slot for the lines the remaster adds to \
scripts. Each feature writes its line there just before the step that shows \
it, and none shows a line while another's is up: Save files' choice comes \
first in a Guru's conversation and starts Guru travel's part through \
fax_travel_begin, and Block's line follows only the end of a shop's script or \
the Battle Helmet's pickup, never a Guru's. Guru travel and Save files write \
their own line again before each one they say. After a save state loads, Save \
files puts its line back in state_loaded, after Guru travel's record has \
restored its own, and Block puts back its line if it was saying it."""

[[shared_rom]]
bank = 12
start = 0xAE00
end = 0xAE07
features = ["guru-travel", "block"]
why = """Guru travel's SAY step, $AE00-$AE02: SHOW_MESSAGE $C3, END. Block \
serves the same three bytes there to show its line from message $C3, so \
whichever served them last, the step is the same. Block never touches Guru \
travel's ASK step ($AE03-$AE06)."""

[[shared_site]]
addr = 0x826E   # IScripts_InvokeNextAction
hooks = ["faxanadu.travel.next-action", "faxanadu.files.next-action", "faxanadu.shops.next-action"]
why = """None handles the call; each only steers the interpreter by writing \
IScriptOrCHRAddr. None redirects to an address another acts on: with a \
file in play Guru travel leaves the script's ends to Save files \
(fax_files_guru_choice), Save files acts on the Gurus' own actions and its \
own steps, and it undoes SET_SPAWN_POINT's raise at the next action rather \
than skipping it, so Guru travel still meets the Guru there. Quick shops acts \
only on a script with the shops' layout, at its first action (IScriptOffset \
1, before which the others have moved nothing in a shop), and then only on \
its two list steps; no Guru's script has that layout, and no shop's has a \
Guru's action or step. So the three may run in any order."""

[[feature]]
id = "block"
package = "faxanadu.remastered"
plugin = "faxanadu.block"
source = "fax_block.c"
hooks = "faxanadu.block."
# Borrowed from Guru travel (fax_travel.h) and served through the same read
# overrides, rather than ROM of its own: 55 of the 64 overrides are Guru
# travel's, and a line of its own would need 48 more.
rom = [
    { bank = 12, start = 0xAE00, end = 0xAE03, use = "Guru travel's SAY step, to show its line" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the line slot, for its line" },
]
# Hooks GameLoop_CountdownItems ($C88F), Player_HandleHitByMagic ($87DC),
# Player_HandleTouchEnemyMagic ($8999) and IScriptAction_EndScript ($82B4),
# which no other feature hooks, and Sugata's flash's damage, shared (below).
# Writes the stack (a return address, as a JSR would) and, when the tutorial
# speaks, IScriptOrCHRAddr and IScriptOffset. It plays sound $0C with
# Sound_PlayEffect. Its host input callback clears the d-pad, A and B while
# Block is up in play; no other feature has an input callback. The tutorial
# speaks only as the script that gave the hero his first shield-slot item ends
# (a shop's, or the Battle Helmet's pickup, ISCRIPT_GOT_BATTLE_HELMET at
# $A698), never in a Guru's.

[[feature]]
id = "sugata-flash"
package = "faxanadu.remastered"
plugin = "faxanadu.sugata-flash"
source = "fax_sugata.c"
hooks = "faxanadu.sugata."
rom = []
# Hooks SpriteBehavior_FlashScreenHitPlayer ($AB26, $AB36, and $AB44, shared
# with Block below) and SpriteUpdateHandler_Enemy_Sugata ($929F), which only
# Sugata runs. Writes PPU_Mask's greyscale bit (clearing what the behavior
# just set), Temp_00 and the stack, and Sugata's HP and knockback through
# Player_HitEnemyWithMagic's own code when the Magic Shield reflects. Under
# Ointment it writes what the flash itself writes, Player_InvincibilityPhase
# and Player_StatusFlag's knockback bit, and plays sound 4. It draws the band
# over the presented picture, after Seamless composes it and before the zone
# banner.

[[shared_site]]
addr = 0xAB44   # SpriteBehavior_FlashScreenHitPlayer's damage
hooks = ["faxanadu.sugata.hit", "faxanadu.block.flash"]
why = """The order matters, and game.toml fixes it: Sugata's flash's site \
comes first. It handles the call when the flash is out of reach, the Magic \
Shield reflects it, or Ointment keeps the HP (only with Block down), and then \
Block's is skipped; otherwise it returns 0 and Block's stops the flash if \
Block is up. Both finish the behavior the same way, through $AB60. Block's \
site first would stop a flash the Magic Shield should turn back."""

[[feature]]
id = "quick-shops"
package = "faxanadu.remastered"
plugin = "faxanadu.shops"
source = "fax_shops.c"
hooks = "faxanadu.shops."
rom = []
# No ROM and no read overrides. Writes only the game's own variables, while a
# shop's script runs: IScriptOrCHRAddr and IScriptOffset (the next step),
# Menu_CursorPos, the list (DataArray, ShopItemCostsL/U, Arg_StringsCount)
# after ShowSellMenu's scan, and the stack below S where a step is entered by
# return. It shares IScripts_InvokeNextAction ($826E) with Guru travel and Save
# files (declared above); its other sites are in the shops' list actions,
# which no other feature hooks. Save files' override of the Buy/Sell menu's
# operand ($8631) is for the Guru's menu: a shop never runs that menu, since
# Quick shops opens its list instead.
