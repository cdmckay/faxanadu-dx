[[feature]]
id = "save-files"
package = "faxanadu.dx"
plugin = "faxanadu.save-files"
source = "src/fax_files.c"
hooks = "faxanadu.files."
# Supplied through read overrides; the ROM image itself is never changed.
# $AE14, where B on the question goes on to, is never read: the next-action
# hook steers the interpreter on before it is, so it is not served.
rom = [
    { bank = 12, start = 0xAE10, end = 0xAE14, use = "the Guru's choice: the menu (0F SAY) or the question (16 C3 SAY)" },
    { bank = 12, start = 0xAE15, end = 0xAE18, use = "its own SAY step (03 C3 00), for when Guru travel's is not served" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the Guru's line slot, shared with Guru travel" },
]
overrides = [
    { bank = 12, start = 0x8631, stock = [0x10], use = "IScriptAction_ShowBuySellMenu's LDA #$10: the menu's message, served as $C3 for the Guru's menu only" },
]
# Hooks StartScreen_CheckHandleInput ($9F44) and its LDA #$AD after the
# arrow's X and Y are loaded ($9F64, bank 12), PasswordScreen_Show ($909D), the start
# screen's JMP Player_Spawn ($FC95) and Player_Spawn after Game_SpawnInTemple
# ($DB20), which no other feature hooks,
# IScripts_InvokeNextAction ($826E) with Guru travel, and
# TextBox_ClearPasswordSize after it zeroes the line scroll ($F439) with the
# quest log (below).
# The operand is $C3 only from the Guru's menu step to the end of that frame
# (the menu reads it at once), then the stock $10 again, so the shops' menu
# never sees it. Writes TempleSpawnPoint (the saved Guru), the joypad's
# changed mask on the title screen, DAT_0687 (Start or Continue), X and Y at
# $9F64 (the arrow's place, on the title only), IScriptOrCHRAddr and IScriptOffset,
# and the progress Password_Load would write when continuing.

[[shared_rom]]
bank = 13
start = 0xB45B
end = 0xB48B
features = ["guru-travel", "save-files", "block", "quest-log", "recharging-items", "magician-lesson"]
why = """Message $C3, one line slot for the lines the remaster adds to \
scripts. Each feature writes its line there just before the step that shows \
it, and none shows a line while another's is up: Recharging items' Elixir \
line opens a Guru's conversation, before his greeting, and is read before \
any of the others speak; Save files' choice comes next and starts Guru \
travel's part through fax_travel_begin, and Block's line follows only the end \
of a shop's script or the Battle Helmet's pickup, never a Guru's. The quest \
log's lines follow a script's end too, after Block's (its hook at \
IScriptAction_EndScript comes second), and come only at the end of a script \
that gave or completed a quest, which no temple Guru's does, so never with \
Save files' or Guru travel's. The Magician's lesson speaks only in Eolis's \
Magician's script, where no other feature speaks until it ends (it gives \
no shield and no quest), and its last line is read before that end. Every \
feature writes its own line again before each one it says. After a save \
state loads, Save files puts its line back in state_loaded, after Guru \
travel's record has restored its own, and Block, the quest log, Recharging \
items and the Magician's lesson put back theirs, after it, if they were \
saying them."""

[[shared_rom]]
bank = 12
start = 0xAE00
end = 0xAE07
features = ["guru-travel", "block", "quest-log", "recharging-items", "magician-lesson"]
why = """Guru travel's SAY step, $AE00-$AE02: SHOW_MESSAGE $C3, END. Block, \
the quest log and Recharging items serve the same three bytes there to show \
their lines from message $C3, so whichever served them last, the step is the \
same. The Magician's lesson serves all seven, the SAY step and Guru travel's \
ASK step ($AE03-$AE06: QUESTION_JUMP_IF_ACCEPTED $C3 to SAY), with the same \
bytes as Guru travel; no one else touches ASK."""

[[shared_site]]
addr = 0x826E   # IScripts_InvokeNextAction
hooks = ["faxanadu.travel.next-action", "faxanadu.files.next-action", "faxanadu.shops.next-action",
         "faxanadu.lesson.next-action", "faxanadu.recharge.guru"]
why = """None handles the call; Save files, Guru travel and Quick shops only \
steer the interpreter by writing IScriptOrCHRAddr. None redirects to an \
address another acts on: with a file in play Guru travel leaves the script's \
ends to Save files (fax_files_guru_choice), Save files acts on the Gurus' own \
actions and its own steps, and it undoes SET_SPAWN_POINT's raise at the next \
action rather than skipping it, so Guru travel still meets the Guru there. \
Quick shops acts only on a script with the shops' layout, at its first action \
(IScriptOffset 1, before which the others have moved nothing in a shop), and \
then only on its two list steps; no Guru's script has that layout, and no \
shop's has a Guru's action or step. Guru travel also forgets a conversation \
of its own that B ended when any script begins (IScriptOffset 1), before \
anyone steers it. Recharging items, at a Guru's first action (a temple Guru's \
SET_SPAWN_POINT, or $A0BD for Eolis's), which none redirects, charges a spent \
Elixir (SpecialItems), which none reads there, and chooses the Guru's Elixir \
line. It shows the line by pointing the script at Guru travel's SAY step \
before an action no other hook acts on ($A0BD itself, or the \
CHECK_UPDATE_PLAYER_TITLE after a temple Guru's SET_SPAWN_POINT, so \
SET_SPAWN_POINT still runs where Save files and Guru travel see it), and \
points it back at the step's END ($AE02). There Guru travel, whose \
conversation in this script has not begun (meet() at SET_SPAWN_POINT, or the \
reset above, left it idle), does nothing, and Save files acts at $AE02 only \
after its saved line, which comes later in a conversation. Its site is the \
last here, so the others always see the Guru's own action and the step's \
END, never the SAY step it points at. The Magician's lesson acts on Eolis's \
Magician's script ($A35D), which has neither a Guru's actions nor the shops' \
layout, so none of the others acts in it: at his first action it points the \
script at Guru travel's SAY step, from its END at the SAY step again or the \
ASK step, then at his own pay step ($A360), or the SAY step's END. At those \
steps it acts only in a conversation of his it began, which it forgets when \
any script begins (IScriptOffset 1, which it sees before Recharging items \
moves anything), and Guru travel's conversation, Save files' choice and \
Recharging items' line are never under way in his script, so they do nothing \
there. In the magic hall's Magician's script ($A368), likewise no Guru's and \
no shop's, it only reads where the script stands. So the five may run in this \
order."""

[[feature]]
id = "block"
package = "faxanadu.dx"
plugin = "faxanadu.block"
source = "src/fax_block.c"
hooks = "faxanadu.block."
# Borrowed from Guru travel (fax_travel.h) and served through the same read
# overrides, rather than ROM of its own: 55 of the 64 overrides are Guru
# travel's, and a line of its own would need 48 more.
rom = [
    { bank = 12, start = 0xAE00, end = 0xAE03, use = "Guru travel's SAY step, to show its line" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the line slot, for its line" },
]
# Hooks GameLoop_CountdownItems ($C88F) and Player_HandleTouchEnemyMagic
# ($8999), which no other feature hooks, and IScriptAction_EndScript ($82B4),
# Sugata's flash's damage and Player_HandleHitByMagic ($87DC), shared (under
# the quest log, below, and under Small fixes).
# Writes the stack (a return address, as a JSR would) and, when the tutorial
# speaks, IScriptOrCHRAddr and IScriptOffset. It plays sound $0C with
# Sound_PlayEffect. Its host input callback clears the d-pad, A and B while
# Block is up in play; no other feature has an input callback. The tutorial
# speaks only as the script that gave the hero his first shield-slot item ends
# (a shop's, or the Battle Helmet's pickup, ISCRIPT_GOT_BATTLE_HELMET at
# $A698), never in a Guru's.
# What Block looks like: Player_DrawBody ($EBEE) and Player_DrawWeapon
# ($B7D6), at their entries, which no other feature hooks (Seamless hooks
# Player_DrawShield's entry, $B982, and the falling pose
# Maybe_Player_CalcAnimFrame, $B927). As Block goes up it writes the palette
# bits of the body's sprites in the shadow OAM ($0700), the slots
# Player_DrawBody just drew; never the shield's sprites or its box
# (Player_ShieldPositionX/Y).

[[feature]]
id = "sugata-flash"
package = "faxanadu.dx"
plugin = "faxanadu.sugata-flash"
source = "src/fax_sugata.c"
hooks = "faxanadu.sugata."
rom = []
# Hooks SpriteBehavior_FlashScreenHitPlayer ($AB26, $AB36, and $AB44, shared
# with Block below) and SpriteUpdateHandler_Enemy_Sugata ($929F), which only
# Sugata runs. Writes PPU_Mask's greyscale bit (clearing what the behavior
# just set), Temp_00 and the stack, and Sugata's HP and knockback through
# Player_HitEnemyWithMagic's own code when the Magic Shield reflects. Under
# Ointment it writes what the flash itself writes, Player_InvincibilityPhase
# and Player_StatusFlag's knockback bit, and plays sound 4. It draws the band
# over the presented picture, after Seamless composes it and before the zone
# banner.

[[shared_site]]
addr = 0xAB44   # SpriteBehavior_FlashScreenHitPlayer's damage
hooks = ["faxanadu.sugata.hit", "faxanadu.block.flash"]
why = """The order matters, and game.toml fixes it: Sugata's flash's site \
comes first. It handles the call when the flash is out of reach, the Magic \
Shield reflects it, or Ointment keeps the HP (only with Block down), and then \
Block's is skipped; otherwise it returns 0 and Block's stops the flash if \
Block is up. Both finish the behavior the same way, through $AB60. Block's \
site first would stop a flash the Magic Shield should turn back."""

[[feature]]
id = "quick-shops"
package = "faxanadu.dx"
plugin = "faxanadu.shops"
source = "src/fax_shops.c"
hooks = "faxanadu.shops."
rom = []
# No ROM and no read overrides. Writes only the game's own variables, while a
# shop's script runs: IScriptOrCHRAddr and IScriptOffset (the next step),
# Menu_CursorPos, the list (DataArray, ShopItemCostsL/U, Arg_StringsCount)
# after ShowSellMenu's scan, and the stack below S where a step is entered by
# return. It shares IScripts_InvokeNextAction ($826E) with Guru travel and Save
# files (declared above); its other sites are in the shops' list actions,
# which no other feature hooks. Save files' override of the Buy/Sell menu's
# operand ($8631) is for the Guru's menu: a shop never runs that menu, since
# Quick shops opens its list instead. It reads, never writes, whether reusable
# tools and recharging items are on and the Elixir is spent (fax_keys.h,
# fax_recharge.h), to show what the hero owns; its buy list's A ($8402) skips
# the game's checks for an owned item.

[[feature]]
id = "zone-respawn"
package = "faxanadu.dx"
plugin = "faxanadu.zone-respawn"
source = "src/fax_respawn.c"
hooks = "faxanadu.zone-respawn."
rom = []
# Hooks Screen_SetupNew ($DD13), Player_HandleDeath's JSR Screen_FadeToBlack
# after the gold and experience far call ($D9A0), Player_Spawn's JSR
# Game_SpawnInTemple ($DB1D) and Game_SetupEnterBuilding ($DAAF), which no
# other feature hooks, so no site is shared.
# Guru travel's journey returns into $DB1D; this site only observes it
# (returns 0), and travel's own site is at Game_SpawnInTemple ($DD61). A death
# with a checkpoint skips the JSR at $DB1D as if it returned at once, so
# Player_Spawn goes on at $DB20, where Save files' spawned hook saves the file
# as at every respawn; then $DAAF, called from there, runs
# Game_SetupExitBuilding instead. Writes, only then: Area_SavedArea,
# Area_SavedScreen, Screen_SavedPalette, Player_SavedPosXY ($03D5-$03D8),
# Area_Region, Areas_DefaultMusic, the facing bit of Player_Flags, and a
# return address pushed on the stack at each site, as a JSR would. No read
# overrides.

[[feature]]
id = "recharging-items"
package = "faxanadu.dx"
plugin = "faxanadu.recharge"
source = "src/fax_recharge.c"
hooks = "faxanadu.recharge."
# A Guru's Elixir line borrows Guru travel's SAY step and line slot
# (fax_travel.h), as Block's tutorial and the quest log do, through the same
# read overrides: no override of its own, so the budget stays at 64.
rom = [
    { bank = 12, start = 0xAE00, end = 0xAE03, use = "Guru travel's SAY step, to show a Guru's Elixir line" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the line slot, for a Guru's Elixir line" },
]
# Writes DurationWingBoots (through A at its STA, then each frame of a
# flight) and DurationHourGlass (each frame of a freeze), Player_MP (both
# items run on it), drawing its bar with Player_SetMP in a committed call,
# SpecialItems' Elixir bit (when a Guru recharges it) and T:'s two tiles
# through the PPU buffer, as UI_DrawTimeValue queues them; and the stack, a
# return address as a JSR would push it, to jump past Player_UseHourGlass's
# halving and into the two countdowns' DEC. MP refill (mana-refill) sees the
# drain as spends and holds while either runs (fax_recharge_draining). Its
# site at IScripts_InvokeNextAction ($826E) hears a Guru's first action,
# which Save files and Guru travel leave where it is, and to show his Elixir
# line writes IScriptOrCHRAddr and IScriptOffset (to the SAY step, then
# back). Keeps the fields recharge.elixir and recharge.elixir_told in the
# file in play (fax_save.h), when Save files has one, and drops #27's
# recharge.wingboots and recharge.hourglass from it.

[[feature]]
id = "charges"
package = "faxanadu.dx"
plugin = "faxanadu.charges"
source = "src/fax_charges.c"
hooks = "faxanadu.charges."
rom = []
# No hooks and no ROM: it reads RAM, Recharging items' state
# (fax_recharge_charge) and the last frame's nametable at the end of each
# frame, and draws the Elixir over the presented picture, left of the status
# bar, after Seamless has composed it (Seamless lays the status bar out with
# it: fax_world_hud_x). Its picture is bank 10's, read from the cart image.
# Writes nothing.

[[feature]]
id = "mana-refill"
package = "faxanadu.dx"
plugin = "faxanadu.mana-refill"
source = "src/fax_mana.c"
hooks = "faxanadu.mana-refill."
rom = []
# No hooks and no ROM: it reads RAM and the stack at the end of each frame.
# When Game_MainLoop is waiting in WaitForNextFrame from its top, it may give
# 1 MP through Player_AddMP ($C0D9) in a committed call, which writes
# Player_MP, the MP bar's two commands in the PPU buffer (with
# PPUBuffer_WriteOffset) and Player_SetMP's temporaries (PPU_TargetAddr,
# Temp_Int24, Temp_0xEF), and the stack below S; the CPU's registers are put
# back. Nothing else runs then, so nothing else is using them. No read
# overrides. Not in save files: continuing fills MP.

[[feature]]
id = "magician-lesson"
package = "faxanadu.dx"
plugin = "faxanadu.magician-lesson"
source = "src/fax_lesson.c"
hooks = "faxanadu.lesson."
# Borrowed from Guru travel (fax_travel.h) and served through the same read
# overrides, with the same bytes, rather than ROM of its own: the override
# budget is full.
rom = [
    { bank = 12, start = 0xAE00, end = 0xAE07, use = "Guru travel's SAY and ASK steps, to show and ask its lines" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the line slot, for its lines" },
]
# Its site at IScripts_InvokeNextAction ($826E, shared, above) acts only in
# Eolis's Magician's script and the steps it sends it to, and writes
# IScriptOrCHRAddr and IScriptOffset; in the magic hall's Magician's script
# ($A368) it only notes, at the step that gives Fire ($A372), that the hero
# has studied there, and writes nothing. Its site in IScriptAction_SpendGold
# ($8367, bank 12), which no other feature hooks and which returns 0, writes
# Temp_0202/3, the amount the next instructions copy to Temp_Int24 to check
# and take: on his pay step, while his lesson is being bought, 200 becomes
# the lesson's price. Its site at IScripts_ProgressivelySubtractGold's JSR
# Player_SubtractGold ($8347, bank 12), which no other feature hooks (Double
# gold's count is on the add side, $8560) and which returns 0, writes
# Temp_0202/3 (140 more taken) and Temp_Int24 (the subtract, 150 for 10), only
# while his pay step runs: every other payment counts 10 a frame. Keeps the
# fields lesson.studied and lesson.learned in the file in play (fax_save.h),
# when Save files has one, and reads the core field spells for a file from
# before lesson.studied. MP refill reads learned (fax_lesson_learned) for its
# schedule.

[[feature]]
id = "double-gold"
package = "faxanadu.dx"
plugin = "faxanadu.double-gold"
source = "src/fax_gold.c"
hooks = "faxanadu.double-gold."
rom = []
# Five sites no other feature hooks, each returning 0: IScriptAction_AddGold's
# JSR IScripts_ProgressivelyAddGold ($8531, bank 12), where on the King's step
# it writes Temp_0202/3 (the amount still to pay, 1500 made 3000);
# IScripts_ProgressivelyAddGold's JSR Player_AddGold ($8560, bank 12), where
# on the King's step it writes Temp_0202/3 (10 more taken) and Temp_Int24 (the
# add, 20 for 10); IScriptAction_IfPlayerHasGold's no-gold JMP
# IScripts_SkipAddrAndInvoke ($862A, bank 12), where at the King's CHECK_GOLD,
# once he has given, it writes IScriptOrCHRAddr and IScriptOffset (two bytes
# before $A35A, where the skip then lands); the text box's reader after LDA
# (Temp_Int24),Y ($F4DF, fixed bank), where it changes A for two digits of
# message $35 (the King's plea names the amount); and Player_HandleTouchCoin
# before its add ($8B9F, bank 14), where it writes Gold, Gold_M and Gold_U.
# Each write is the game's own variable, read by the code that follows. No
# read overrides (the budget is full) and no ROM. Selling pays through the
# same IScripts_ProgressivelyAddGold from IScriptAction_ShowSellMenu, with the
# script in a shop's, never at the King's END, so at 10 a frame. Keeps the
# field gold.king_given in the file in play (fax_save.h), and whether the
# King has given in its save-state record.

[[feature]]
id = "fair-entrances"
package = "faxanadu.dx"
plugin = "faxanadu.fair-entrances"
source = "src/fax_entrances.c"
hooks = "faxanadu.fair-entrances."
rom = []
# Hooks Sprites_PopulateNextAvailableSprite ($C205), which no other feature
# hooks, and writes CurrentSprite_XPos and CurrentSprite_YPos ($0389, $038A)
# there, before the routine copies them into a sprite slot. Seamless calls
# fax_entrances_room_loaded on its isolated machines, where it writes a moved
# enemy's CurrentSprites_XPos_Full and CurrentSprites_YPos slot ($BA-$C9).
# No read overrides: bank 11's placement bytes are served as they are.

[[shared_site]]
addr = 0xC4BF   # Player_ClearSelectedItem
hooks = ["faxanadu.reusable-tools.mattock", "faxanadu.recharge.keep"]
why = """Each handles only the calls fax_items.h gives it, told by the JSR's \
return address: reusable tools Player_UseMattock's, recharging items \
Player_UseWingBoots' and Player_UseHourGlass's. A call one handles the other \
would pass, so either may fire first."""

[[shared_site]]
addr = 0xC88F   # GameLoop_CountdownItems
hooks = ["faxanadu.block.main-loop", "faxanadu.recharge.tick"]
why = """Both observe and return 0, so both always run, in either order. Block \
only notes that Game_MainLoop got this far this frame; recharging items \
queues T: and any bar still to draw before the game's own countdowns, which \
neither changes (its flight and freeze run at sites inside them)."""

[[feature]]
id = "slain-by"
package = "faxanadu.dx"
plugin = "faxanadu.slain-by"
source = "src/fax_slain.c"
hooks = "faxanadu.slain-by."
rom = []
# Hooks Player_ReduceHP ($C08E) and Sprite_Maybe_ResetState ($A202, bank 14),
# which no other feature hooks, and only observes both (returns 0), so the
# death path and every hit play out as without it. Sugata's flash (its sites
# at $AB26-$AB44) and Block (at Player_HandleHitByMagic and $AB44) decide
# before Player_ReduceHP is reached: a hit they stop never gets here. Writes
# nothing to the machine; it draws its line through the zone names banner
# (fax_banner_draw), which needs no hooks either. No read overrides.

[[feature]]
id = "title-remastered"
package = "faxanadu.dx"
plugin = "faxanadu.title-remastered"
source = "src/fax_title.c"
hooks = "faxanadu.title-remastered."
rom = []
# DX on the title. Its plugin, hook sites and save-state record keep their
# names from before the project was Faxanadu DX (#116): save states know
# the record by its name.
# Hooks only Game_ShowStartScreen's @_afterCheckHandleInputFarJump ($FC7A),
# which no other feature hooks, and returns 0 there: it notes that the title's
# loop ran this frame and writes nothing. StartScreen_CheckHandleInput, run or
# handled by Save files, returns to $FC7A as its RTS would, so the site fires
# each frame of the title. The word is drawn over the presented picture
# (fax_text.c), on the logo (lit on y 116-122, outlined on 115-123), clear of
# Save files' menu and file picks (from y 144).

[[feature]]
id = "indoor-equip"
package = "faxanadu.dx"
plugin = "faxanadu.indoor-equip"
source = "src/fax_indoor.c"
hooks = "faxanadu.indoor-equip."
rom = []
# Hooks Game_EnterBuilding after its weapon clear ($DE0B), Player_SetWeapon's
# area check ($EDF1) and the Select menu's (bank 12, $8B88), which no other
# feature hooks. Writes Player_CurWeapon ($03C8) on the way into a building,
# from SelectedWeapon, and clears Z at the two branches. Zone respawn's site at
# Game_SetupEnterBuilding ($DAAF) runs before $DE0B and, when it swaps in
# Game_SetupExitBuilding, $DE0B is never reached: that loader sets
# Player_CurWeapon itself. No read overrides.

[[feature]]
id = "damage-numbers"
package = "faxanadu.dx"
plugin = "faxanadu.damage-numbers"
source = "src/fax_damage.c"
hooks = "faxanadu.damage-numbers."
rom = []
# Hooks @_updateSpriteHP ($8891) and @_reduceEnemyHP ($81FD) in bank 14, and
# Player_ReduceHP's SEC ($C091, not its entry), which no other feature hooks,
# and only observes all three (returns 0): every hit plays out as without it.
# The Pendant fix sets Temp_00 at $8884, before $8891 reads it, so the number
# is the fixed damage. Sugata's flash and Block decide at $AB44 and
# Player_HandleHitByMagic, before Player_ReduceHP is reached, so a hit they
# stop shows nothing; Sugata's reflection runs $81FD in a committed call,
# where no hook fires, and reports itself through fax_damage_enemy_hit. Writes
# nothing to the machine and draws at present time. No ROM, no read overrides.

[[feature]]
id = "inventory-fix"
package = "faxanadu.dx"
plugin = "faxanadu.inventory-fix"
source = "src/fax_inventory.c"
hooks = "faxanadu.inventory-fix."
rom = []
# Hooks the CPX #$04 of Player_PickUpBattleSuit ($C6FA) and of
# Player_PickUpDragonSlayer ($C73A), which no other feature hooks, and sets
# only X (and N, Z) there, from the list's own count. Block's tutorial looks
# at the Battle Helmet's script, never these two. Recharging items' pickup
# hook is Player_PickUpItem ($C8CD), the Items' routine, which neither
# reaches. No ROM, no read overrides, no state.

[[feature]]
id = "map"
package = "faxanadu.dx"
plugin = "faxanadu.map"
source = "src/fax_map.c"
hooks = "faxanadu.map."
rom = []
# Hooks GameLoop_CheckPauseGame's two BEQs, $E02F (Start not new: return) and
# $E040 (Start not new: another frame paused), with the quest log, whose
# hooks come after (below); Seamless observes the routine's entry, $E02B,
# which runs before either. It
# changes only A and Z at them, so the game's own code pauses and unpauses
# (Game_PausedState). And Player_HandleTouchItem ($88FB, bank 14), after Kept
# finds' site there, where it only observes X, the slot of the item touched
# (recharging items' pickup hook is Player_PickUpItem, $C8CD, further in).
# Reads bank 3's area tables, bank 15's town edges and climb and bank 11's
# sprite lists from a copy of the cart, writes nothing to the machine but A and
# Z at the BEQs, and draws at present time. No ROM, no read overrides.

[[feature]]
id = "small-fixes"
package = "faxanadu.dx"
plugin = "faxanadu.small-fixes"
source = "src/fax_fixes.c"
hooks = "faxanadu.small-fixes."
rom = []
# Hooks SoundEffect_Message_OnTick's TAX ($86B2, bank 5), which no other
# feature hooks, and Player_HandleHitByMagic ($87DC), shared with Block
# (below). At the TAX it changes only A. At Player_HandleHitByMagic it only
# reads Player_InvincibilityPhase and DurationOintment. No ROM, no read
# overrides, no state.

[[shared_site]]
addr = 0x87DC   # Player_HandleHitByMagic
hooks = ["faxanadu.block.shield-hit", "faxanadu.small-fixes.shield-hit"]
why = """Both only skip the routine, so the shield lets nothing through, or \
decline; neither writes anything. Block's comes first in game.toml and \
handles the call while Block is up, counting the save as its own, iframes \
or Ointment running or not; Small fixes' then handles it during iframes or \
under Ointment. Either way the caller, Player_HandleShieldHitByMagic, \
removes the shot with the shield's sound."""

[[feature]]
id = "graphics-fix"
package = "faxanadu.dx"
plugin = "faxanadu.graphics-fix"
source = "src/fax_graphics.c"
hooks = "faxanadu.graphics-fix."
rom = []
# Hooks, which no other feature hooks: Sprite_Draw_Standard's and
# Sprite_Draw_FlippedHoriz's instructions after each cell's tile and attribute
# loads ($F131, $F13B, $F1E5, $F1EF), PPU_WriteTilesFromCHRRAM's STA PPUDATA
# ($F8B7) and Area_LoadScrollData after its current screen's Area_LoadBlocks
# ($D1BE). Each sets only A there (for three bytes of bank 7's tile info and
# one of the title's attributes) or ScreenBuffer's one block of Trunk's $2D.
# Falling pose changes which pose is drawn and Block's glint rewrites OAM
# palettes after Player_DrawBody, both before or after these reads, never the
# bytes these change. No ROM, no read overrides, no state. Seamless decodes
# its rooms through fax_world_set_room_fixup, which this feature sets.

[[feature]]
id = "quest-log"
package = "faxanadu.dx"
plugin = "faxanadu.quest-log"
source = "src/fax_quests.c"
hooks = "faxanadu.quests."
# Its lines borrow Guru travel's SAY step and line slot (fax_travel.h), as
# Block's tutorial does, through the same read overrides: no override of its
# own, so the budget stays at 64.
rom = [
    { bank = 12, start = 0xAE00, end = 0xAE03, use = "Guru travel's SAY step, to show its lines" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the line slot, for its lines" },
]
# Hooks Messages_Load ($F3F5), which no other feature hooks, only observing
# (A, the message); IScriptAction_EndScript ($82B4) after Block, the line
# scroll at $F439 after Save files, and GameLoop_CheckPauseGame's two BEQs
# ($E02F, $E040) after the map (below). When it speaks it writes
# IScriptOrCHRAddr, IScriptOffset and the stack (a return address, through
# fax_block_return_via), and while its line loads, TextBox_LineScrollOffset.
# At the BEQs it changes only A and Z, as the map does. Reads bank 12's
# scripts and bank 14's sprite categories and extents from a copy of the cart,
# and draws at present time.

[[shared_site]]
addr = 0x82B4   # IScriptAction_EndScript
hooks = ["faxanadu.block.end-script", "faxanadu.quests.end-script"]
why = """Both may point the script at Guru travel's SAY step and handle the \
call, returning through IScripts_InvokeNextAction, so their lines come one \
after the other in the same box. Block's runs first: when it speaks, the \
quest log's is skipped that time, and when Block's line ends (Block sets its \
phase back and returns 0) the quest log's runs and says its lines. When the \
quest log speaks, Block has already declined. Each knows its own line by its \
own phase, so neither takes the other's END for its own."""

[[shared_site]]
addr = 0xF439   # TextBox_ClearPasswordSize, after STA TextBox_LineScrollOffset
hooks = ["faxanadu.files.scroll", "faxanadu.quests.scroll"]
why = """Both only observe and return 0, each putting back the line scroll \
offset only while its own lines are up: Save files' in a temple Guru's \
conversation, the quest log's at the end of a script that gave or completed \
a quest, which no temple Guru's does. So at most one writes, and the order \
does not matter."""

[[shared_site]]
addr = 0xE02F   # GameLoop_CheckPauseGame's BEQ: Start not new
hooks = ["faxanadu.map.check", "faxanadu.quests.check"]
why = """Each opens its screen when its own button was pressed, clearing Z \
so the game pauses as for Start, and returns 0. The map's runs first; the \
quest log's then sees the map open (fax_map_showing) and drops its press, \
and neither button opens its screen while the other's is open, so only one \
steers the branch."""

[[shared_site]]
addr = 0xE040   # the pause loop's BEQ: Start not new
hooks = ["faxanadu.map.loop", "faxanadu.quests.loop"]
why = """Only the one whose screen is open steers the branch (it reads the \
pad, then sets or clears Z); the other returns 0 at once, having nothing \
open, and opens its own only when its button was pressed during the game's \
own pause with the other's screen closed. The map's runs first."""

[[shared_site]]
addr = 0x88FB   # Player_HandleTouchItem
hooks = ["faxanadu.kept-finds.touch", "faxanadu.map.touch"]
why = """Kept finds handles the touch only when the find would be lost to a \
full Items list, and then the sprite stays lying, so the map's site, which \
counts an item taken, is rightly skipped. Otherwise Kept finds returns 0 and \
the map observes X as the game picks the item up."""

[[feature]]
id = "kept-finds"
package = "faxanadu.dx"
plugin = "faxanadu.kept-finds"
source = "src/fax_finds.c"
hooks = "faxanadu.kept-finds."
rom = []
# Hooks Player_HandleTouchItem's entry ($88FB, bank 14), before the map's
# site there, and skips the routine (nothing written) when a find would be
# lost to a full Items list. Recharging items' pickup hook is
# Player_PickUpItem ($C8CD), which a skipped touch never reaches; a find it
# takes (Wing Boots or an Hour Glass already held) is let through to it. Plays
# sound $0D through Sound_PlayEffect in a committed call, as Recharging items
# does. No ROM, no read overrides, no save-state record.

[[feature]]
id = "spell-cost"
package = "faxanadu.dx"
plugin = "faxanadu.spell-cost"
source = "src/fax_spell_cost.c"
hooks = "faxanadu.spell-cost."
rom = []
# No hooks and no ROM: at present time it reads Player_MP, SelectedMagic,
# UI_MPAndHPBarWidth and the status bar's palette, and recolors the M: bar's
# fill in the presented picture, after Charges draws the Elixir, where
# Seamless put the status bar band (fax_world_hud_x). MAGIC_COSTS is bank
# 14's, read from the cart image. Writes nothing, no read overrides, no
# save-state record.
