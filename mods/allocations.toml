# What each feature takes from the game, so features cannot quietly collide.
#
# Every feature of the remaster is a trusted plugin of the one Faxanadu DX
# switch (package faxanadu.dx, feature `dx`), so they are always on together,
# and may rely on each other. Seamless, the view inherited from upstream, is
# one of them (#110).
# tools/check_allocations.py treats every two features below as enabled
# together, unless their manifest features share an exclusive group, and fails
# when:
#   - a game.toml hook site belongs to no feature, or to two (by id prefix),
#   - a manifest's [[plugin]] belongs to no feature here, or a feature's
#     `plugin` is not in its package's manifest,
#   - two features hook the same address and no [[shared_site]] lists exactly
#     the hooks there, in the order they run, with why that is safe. On the
#     cycle host that order is game.toml's: cyc_hooks_fire walks the sites in
#     the order game.toml declares them, not HOST_EXTRAS link order,
#   - two features claim overlapping ROM and no [[shared_rom]] names both and
#     says why that is safe,
#   - a [[shared_site]] or [[shared_rom]] no longer matches what it covers,
#   - the bytes claimed, all served through read overrides, need more entries
#     than the override table has (CYC_MOD_READ_OVERRIDES_MAX, 64),
#   - a claimed ROM range is not unused ($FF) in the stock image (with --rom),
#   - an overridden ROM byte is not its declared stock value (with --rom).
# ROM claims come in two kinds: `rom` takes unused ($FF) bytes for new data,
# and `overrides` takes existing bytes the feature serves with other values,
# one byte per entry of `stock` (what the stock image holds there). Claim
# every byte a feature serves, even one it borrows from another feature.
# Update this file with the feature, and docs/GAME_INTERNALS.md with it.

[[feature]]
id = "guru-travel"
package = "faxanadu.dx"
plugin = "faxanadu.guru-travel"
source = "src/fax_travel.c"
hooks = "faxanadu.travel."
# Supplied through read overrides; the ROM image itself is never changed.
rom = [
    { bank = 12, start = 0xAE00, end = 0xAE07, use = "SAY and ASK interaction-script steps" },
    { bank = 13, start = 0xB45B, end = 0xB48B, use = "message $C3, the Guru's current line" },
]
# Writes only the game's own variables: TempleSpawnPoint, IScriptOrCHRAddr
# and IScriptOffset, and the stack at $01FA-$01FF when a journey starts.

[[feature]]
id = "seamless-world"
package = "faxanadu.dx"
plugin = "faxanadu.seamless-world"
source = "src/fax_world.c"
hooks = "faxanadu.world."
rom = []

[[shared_site]]
addr = 0xE016   # GameLoop_CheckShowPlayerMenu
hooks = ["faxanadu.world.inventory", "faxanadu.travel.main-loop"]
why = """Seamless (freeze_hook) observes and returns 0, so later sites still \
fire. Guru travel handles the call only to start a journey, and its site is \
the last at this address."""

