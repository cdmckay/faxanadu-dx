format_version = 1
id = "faxanadu.enhancement.zone-names"
version = "1.0.0"
name = "Zone names"
author = "Faxanadu Remastered"
description = "Entering a town, a region, a tower or a castle shows its name for a moment, as the game's dialogue names it."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
rom_crc32 = "57dd23d1"

[[feature]]
id = "zone-names"
name = "Zone names"
description = "When you enter a different town, region, tower or castle, its name appears below the status bar for two seconds, in the game's own text box. Shops, houses and temples show nothing."
group = "Display"
default_enabled = true

[[plugin]]
feature = "zone-names"
id = "faxanadu.zone-names"
