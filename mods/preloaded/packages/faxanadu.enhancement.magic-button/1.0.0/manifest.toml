format_version = 1
id = "faxanadu.enhancement.magic-button"
version = "1.0.0"
name = "Magic button"
author = "faxanadu-remaster"
description = "A button of its own for casting magic, so it never enters a door or talks to anyone by accident."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
rom_crc32 = "57dd23d1"

[[feature]]
id = "magic-button"
name = "Magic button"
description = "C on the keyboard, or Y on a controller, casts your selected spell, as Up+B does, without entering a door, talking or swinging your sword. Up+B still works. Rebind it with MagicKey and MagicButton in config.ini."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "magic-button"
id = "faxanadu.magic-button"
