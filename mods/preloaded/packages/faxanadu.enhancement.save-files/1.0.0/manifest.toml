format_version = 1
id = "faxanadu.enhancement.save-files"
version = "1.0.0"
name = "Save files"
author = "Faxanadu Remastered"
description = "Three save files on the title screen instead of mantras. A Guru offers to remember your journey."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
rom_crc32 = "57dd23d1"

[[feature]]
id = "save-files"
name = "Save files"
description = "Pick one of three files on the title screen to start or continue. Instead of a mantra, a Guru offers to remember your journey, and you come back to the Guru you last saved with. Returning to a temple saves too. Gold, experience, items and the Gurus you have met are kept exactly."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "save-files"
id = "faxanadu.save-files"
