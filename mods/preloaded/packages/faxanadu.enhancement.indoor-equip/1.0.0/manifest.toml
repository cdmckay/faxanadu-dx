format_version = 1
id = "faxanadu.enhancement.indoor-equip"
version = "1.0.0"
name = "Equip indoors"
author = "Faxanadu Remastered"
description = "Equip anything from the menu inside buildings, and hold and swing your weapon there. In the original a sword bought in a shop could not be equipped until you walked outside."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
rom_crc32 = "57dd23d1"

[[feature]]
id = "indoor-equip"
name = "Equip indoors"
description = "The Select menu equips weapons, armor, shields, spells and items inside shops, houses and temples, and the hero keeps his weapon in hand there. Swinging at townsfolk does nothing, as before; enemies in the few rooms that hold them now take the sword as well as magic."
group = "Combat"
default_enabled = true

[[plugin]]
feature = "indoor-equip"
id = "faxanadu.indoor-equip"
