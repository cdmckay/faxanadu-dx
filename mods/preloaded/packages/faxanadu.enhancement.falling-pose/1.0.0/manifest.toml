[[feature]]
id = "falling-pose"
name = "Falling pose"
description = "Walking off a ledge or a ladder, the hero shows the jump pose until he lands, as he does in a jump. Jumping, climbing, attacking and the Wing Boots look as before."
group = "Display"
default_enabled = true

[[plugin]]
feature = "falling-pose"
id = "faxanadu.falling-pose"
