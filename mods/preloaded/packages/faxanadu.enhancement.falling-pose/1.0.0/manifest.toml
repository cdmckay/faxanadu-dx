name = "Falling pose"
author = "Faxanadu Remastered"
description = "The hero falls in the jump pose. In the original, walking off a ledge kept him standing or mid-step all the way down, as if walking on air."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
