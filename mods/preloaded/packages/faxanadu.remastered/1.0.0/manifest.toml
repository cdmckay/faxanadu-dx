format_version = 1
id = "faxanadu.remastered"
version = "1.0.0"
name = "Faxanadu Remastered"
author = "Faxanadu Remastered"
description = "The whole remaster: save files, Guru travel, Block, fairer combat, quicker shops and text, and fixes to the original's bugs. Switch it off to play the original game."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
rom_crc32 = "57dd23d1"

# Every feature of the remaster is a trusted plugin of this one feature, so
# they are on or off together. The features may rely on each other:
# mods/allocations.toml says what each takes and what they share.
[[feature]]
id = "remastered"
name = "Faxanadu Remastered"
description = "Everything the remaster adds, as one: three save files, Guru travel, respawning where you died, Block and the Magic button, the Pendant, the dagger, the Battle Suit and the Dragon Slayer fixed, the typing sound, the mantra's lines and Ointment against magic on the shield fixed, weapons equipped and swung indoors, Sugata's flash with a warning, quick shops, keys found for you and kept, Wing Boots, Hour Glass and Elixir that recharge, forgiving jumps, ladders fixed and held on to, faster text, damage numbers, the names of zones and speakers, what killed you, a quest log with marks over the people who have one, and REMASTERED under the title's logo. Switch it off to play the original game."
group = "Game"
default_enabled = true

