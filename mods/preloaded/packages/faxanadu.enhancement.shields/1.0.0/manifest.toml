[[feature]]
id = "shields"
name = "Shields"
description = "Block: hold V on the keyboard, or B on a controller, with a shield or the Battle Helmet to stand still and stop enemy magic from the front, and Sugata's flash from anywhere, with the shield's sound. Contact and sword damage are as before. While you hold it the shield is drawn raised before your face; with the Battle Helmet, which has no shield to show, you glint as Block goes up. The first shield (or the Battle Helmet) you get, the game tells you once. Rebind it with BlockKey and BlockButton in config.ini. Sugata's flash: Sugata blinks for half a second before it flashes, and the band of screen its flash will reach dims faintly. The flash greys only that band and hurts only there: step out of it, or hold Block. With the Magic Shield, Block turns the flash back on Sugata. Ointment keeps your HP, though the flash still knocks you back."
group = "Combat"
default_enabled = true

[[plugin]]
feature = "shields"
id = "faxanadu.block"

[[plugin]]
