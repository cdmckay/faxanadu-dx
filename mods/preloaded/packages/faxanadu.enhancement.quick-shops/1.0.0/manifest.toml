[[feature]]
id = "quick-shops"
name = "Quick shops"
description = "Up on a shopkeeper opens his list straight away, with no greeting or questions. Select switches between buying and selling, buying or selling keeps you in the list, and B leaves. Prices, the inventory limits and \"not enough Golds\" are the game's own. Any shop buys anything you carry: at half its price where a shop sells it, or 100 Golds, but never the Dragon Slayer, the Battle Suit or the Battle Helmet."
