format_version = 1
id = "faxanadu.enhancement.reusable-tools"
version = "1.0.0"
name = "Reusable tools"
author = "faxanadu-remaster"
description = "Keys and the Mattock are no longer used up: one key opens every door of its kind, and one Mattock breaks every wall."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
rom_crc32 = "57dd23d1"

[[feature]]
id = "reusable-tools"
name = "Reusable tools"
description = "A key stays in your inventory after it opens a door, and the Mattock after it breaks a wall. Potions, the Elixir, the Hour Glass, the Wing Boots and the other consumables are still used up."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "reusable-tools"
id = "faxanadu.reusable-tools"
