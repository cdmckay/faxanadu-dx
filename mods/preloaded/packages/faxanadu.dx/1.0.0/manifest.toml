format_version = 1
id = "faxanadu.dx"
version = "1.0.0"
name = "Faxanadu DX"
author = "Faxanadu DX"
description = "All of Faxanadu DX: one continuous world with no stop to scroll between rooms, save files, Guru travel, Block, fairer combat, quicker shops and text, and fixes to the original's bugs. Switch it off to play the original game."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
rom_crc32 = "57dd23d1"

# Every feature of the remaster is a trusted plugin of this one feature, so
# they are on or off together. The features may rely on each other:
# mods/allocations.toml says what each takes and what they share.
[[feature]]
id = "dx"
name = "Faxanadu DX"
description = "Everything Faxanadu DX adds, as one: Seamless, one continuous world with no stop to scroll between rooms (F4 shows the region), three save files, Guru travel, respawning where you died, Block and the Magic button, the Pendant, the dagger, the Battle Suit and the Dragon Slayer fixed, the typing sound, Ointment against magic on the shield and the original's graphics glitches fixed, finds left lying while your items are full, the gap at Eolis's edge that trapped a flight closed, weapons equipped and swung indoors, Sugata's flash with a warning, quick shops, Red Potions sold by the meat shops, keys found for you and kept, Wing Boots, Hour Glass and Elixir found rather than bought and that recharge, shown ready or not beside the item box, MP that refills when you stop casting, and faster once Eolis's Magician teaches you, twice the gold from the King and from monsters, forgiving jumps, ladders fixed and held on to, faster text, damage numbers, enemies moved off the ways in where they hit before you can react, the names of zones and speakers, what killed you, a quest log with marks over the people who have one, the quest log and the map in the Select menu, and DX under the title's logo. Switch it off to play the original game."
group = "Game"
default_enabled = true
# Seamless draws the picture itself, so the remaster cannot be on with a
# display mode such as an HD pack (nesrecomp's MOD_PACKAGES.md).
exclusive_groups = ["display-mode"]

# Seamless, the view: on whenever the remaster is (#110).
[[plugin]]
feature = "dx"
id = "faxanadu.seamless-world"

