format_version = 1
id = "faxanadu.enhancement.auto-keys"
version = "1.0.0"
name = "Auto keys"
author = "Faxanadu Remastered"
description = "Press Up at a locked door and the right key from your inventory opens it, without selecting it first."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "faxanadu-usa"
rom_crc32 = "57dd23d1"

[[feature]]
id = "auto-keys"
name = "Auto keys"
description = "A locked door opens with its key from anywhere in your inventory, with the usual \"I've used key.\" Whatever item you had selected stays selected. Without the key, you get the door's usual message."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "auto-keys"
id = "faxanadu.auto-keys"
